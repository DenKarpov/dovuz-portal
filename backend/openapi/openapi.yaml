components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dovuz_session

  headers:
    SessionCookie:
      description: '`dovuz_session=<токен>; HttpOnly; SameSite=Strict; Max-Age=864000; Path=/`'
      schema:
        type: string

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PageNumber:
      name: pageNumber
      in: query
      description: Номер страницы, с нуля
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10
    AccountId:
      name: accountId
      in: query
      required: true
      schema:
        type: integer
    SubjectId:
      name: subjectId
      in: query
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Нужно войти в систему
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Файл слишком большой
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    RoleTitle:
      type: string
      description: Роль так, как её показывает и сравнивает фронт
      enum: [Администратор, Модератор, Пользователь]
      x-enum-varnames: [ADMIN, MODERATOR, USER]

    RoleCode:
      type: string
      enum: [ROLE_ADMIN, ROLE_MODERATOR, ROLE_USER]

    Email:
      type: string
      description: Непустые части до и после «@», в домене есть точка; без пробелов и управляющих символов
      maxLength: 254
      pattern: '^[^@\x00-\x20\x7f]+@[^@\x00-\x20\x7f]+\.[^@\x00-\x20\x7f]+$'

    Nickname:
      type: string
      description: 3–32 символа — буквы, цифры, «_», «.», «-»; начинается с буквы или цифры
      pattern: '^[A-Za-zА-Яа-яЁё0-9][A-Za-zА-Яа-яЁё0-9_.-]{2,31}$'

    Password:
      type: string
      description: 8–72 символа, хотя бы одна заглавная буква, одна строчная и одна цифра
      minLength: 8
      maxLength: 72

    Name:
      type: string
      minLength: 1
      maxLength: 300

    PageMeta:
      type: object
      required: [total_pages, total_size, page_number, page_size]
      properties:
        total_pages:
          type: integer
        total_size:
          type: integer
        page_number:
          type: integer
        page_size:
          type: integer

    AuthRegisterRequest:
      type: object
      required: [email, nickname, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        nickname:
          $ref: '#/components/schemas/Nickname'
        password:
          $ref: '#/components/schemas/Password'

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128

    AuthResponse:
      type: object
      required: [nickname, role]
      properties:
        nickname:
          type: string
        role:
          $ref: '#/components/schemas/RoleTitle'

    AccountResponse:
      type: object
      required:
        - id
        - nickname
        - email
        - firstName
        - lastName
        - middleName
        - birthDate
        - description
        - isBanned
        - role
        - photoNameInDirectory
        - schoolId
        - schoolName
        - classId
        - className
      properties:
        id:
          type: integer
        nickname:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        middleName:
          type: [string, 'null']
        birthDate:
          type: [string, 'null']
          format: date
        description:
          type: [string, 'null']
        isBanned:
          type: boolean
        role:
          $ref: '#/components/schemas/RoleTitle'
        photoNameInDirectory:
          type: [string, 'null']
        schoolId:
          type: [integer, 'null']
        schoolName:
          type: [string, 'null']
        classId:
          type: [integer, 'null']
        className:
          type: [string, 'null']

    GetAllUserResponse:
      type: object
      required:
        - id
        - nickname
        - email
        - first_name
        - last_name
        - middle_name
        - photo_name_in_directory
        - school_id
        - school_name
        - class_id
        - class_name
        - role
        - is_banned
