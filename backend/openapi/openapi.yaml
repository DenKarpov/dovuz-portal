openapi: 3.1.0
info:
  title: ДоВуз-Портал API
  version: 0.1.0
  description: |
    Контракт бэкенда АИС «ДоВуз-Портал». Снят со слоя `frontend/src/app/api/`
    и повторяет его как есть, включая смешанное именование полей: часть ответов
    в snake_case, часть в camelCase, query-параметры в camelCase.

    Аутентификация — HTTP-only кука сессии, которую выставляют `/auth/login`
    и `/auth/register`. Ошибки всегда приходят в формате `{"message": "..."}`.
    401 — «не вошёл» (фронт разлогинивает), 403 — «вошёл, но нельзя».
servers:
  - url: /v1
    description: Относительно хоста, с которого отдана спека; локально — http://localhost:8080/v1
security:
  - sessionCookie: []
tags:
  - name: auth
    description: Регистрация, вход и выход
  - name: accounts
    description: Профили и управление пользователями
  - name: roles
    description: Роли
  - name: directions
    description: Направления — верхний уровень иерархии материалов
  - name: subjects
    description: Предметы направления
  - name: subject-topics
    description: Темы предмета
  - name: publications
    description: Публикации в темах предметов
  - name: news
    description: Новостная лента
  - name: comments
    description: Комментарии к публикациям и новостям
  - name: files
    description: Скачивание файлов и картинки для <img>
  - name: schools
    description: Школы
  - name: classes
    description: Классы школ
  - name: moderators
    description: Назначение модераторов на предметы

paths:
  # Регистрация, вход и выход
  /auth/register:
    $ref: 'auth.yaml#/paths/register'
  /auth/login:
    $ref: 'auth.yaml#/paths/login'
  /auth/logout:
    $ref: 'auth.yaml#/paths/logout'

  # Профили и управление пользователями
  /accounts:
    $ref: 'accounts.yaml#/paths/accounts'
  /accounts/{account}:
    $ref: 'accounts.yaml#/paths/account'
  /accounts/{id}/ban:
    $ref: 'accounts.yaml#/paths/ban'
  /accounts/{id}/unban:
    $ref: 'accounts.yaml#/paths/unban'
  /accounts/{id}/profile:
    $ref: 'accounts.yaml#/paths/profile'
  /accounts/{id}/role:
    $ref: 'accounts.yaml#/paths/role'
  /accounts/{nickname}/course-progress:
    $ref: 'accounts.yaml#/paths/course-progress'
  /accounts/school/{schoolId}:
    $ref: 'accounts.yaml#/paths/by-school'
  /accounts/class/{classId}:
    $ref: 'accounts.yaml#/paths/by-class'
  /accounts/me/password:
    $ref: 'accounts.yaml#/paths/my-password'
  /accounts/admin/register:
    $ref: 'accounts.yaml#/paths/admin-register'

  # Роли
  /roles:
    $ref: 'roles.yaml#/paths/roles'

  # Направления — верхний уровень иерархии материалов
  /directions:
    $ref: 'directions.yaml#/paths/directions'
  /directions/{id}:
    $ref: 'directions.yaml#/paths/direction'

  # Предметы направления
  /subjects:
    $ref: 'subjects.yaml#/paths/subjects'
  /subjects/{id}:
    $ref: 'subjects.yaml#/paths/subject'

  # Темы предмета
  /subject-topics:
    $ref: 'subject-topics.yaml#/paths/topics'
  /subject-topics/{id}:
    $ref: 'subject-topics.yaml#/paths/topic'

  # Публикации в темах предметов
  /publications:
    $ref: 'publications.yaml#/paths/publications'
  /publications/{id}:
    $ref: 'publications.yaml#/paths/publication'

  # Новостная лента
  /news_publications:
    $ref: 'news.yaml#/paths/news'

  # Комментарии к публикациям и новостям
  /comments:
    $ref: 'comments.yaml#/paths/comments'
  /comments/revisions:
    $ref: 'comments.yaml#/paths/revisions'
  /comments/create-comment-reply:
    $ref: 'comments.yaml#/paths/reply'
  /comments/{id}:
    $ref: 'comments.yaml#/paths/comment'
  /comments/{id}/replies:
    $ref: 'comments.yaml#/paths/replies'

  # Скачивание файлов и картинки для <img>
  /files/{fileNameInDirectory}:
    $ref: 'files.yaml#/paths/file'
  /files/photos/{filename}:
    $ref: 'files.yaml#/paths/photo'

  # Школы
  /schools:
    $ref: 'schools.yaml#/paths/schools'
  /schools/{id}:
    $ref: 'schools.yaml#/paths/school'

  # Классы школ
  /classes:
    $ref: 'classes.yaml#/paths/classes'
  /classes/school/{schoolId}:
    $ref: 'classes.yaml#/paths/by-school'
  /classes/{id}:
    $ref: 'classes.yaml#/paths/class'

  # Назначение модераторов на предметы
  /admin/moderators/assign:
    $ref: 'moderators.yaml#/paths/assign'
  /admin/moderators/remove:
    $ref: 'moderators.yaml#/paths/remove'
  /admin/moderators/subject/{id}:
    $ref: 'moderators.yaml#/paths/by-subject'
  /admin/moderators/my:
    $ref: 'moderators.yaml#/paths/my'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dovuz_session
