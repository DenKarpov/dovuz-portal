openapi: 3.1.0
info:
  title: ДоВуз-Портал API
  version: 0.1.0
  description: |
    Контракт бэкенда АИС «ДоВуз-Портал». Снят со слоя `frontend/src/app/api/`
    и повторяет его как есть, включая смешанное именование полей: часть ответов
    в snake_case, часть в camelCase, query-параметры в camelCase.

    Аутентификация — HTTP-only кука сессии, которую выставляют `/auth/login`
    и `/auth/register`. Ошибки всегда приходят в формате `{"message": "..."}`.
    401 — «не вошёл» (фронт разлогинивает), 403 — «вошёл, но нельзя».
servers:
  - url: /v1
    description: Относительно хоста, с которого отдана спека; локально — http://localhost:8080/v1
security:
  - sessionCookie: []
tags:
  - name: auth
    description: Регистрация, вход, выход
  - name: accounts
    description: Профили и управление пользователями
  - name: roles
  - name: directions
    description: Направления — верхний уровень иерархии материалов
  - name: subjects
  - name: subject-topics
  - name: publications
    description: Публикации в темах предметов
  - name: news
    description: Новостная лента
  - name: comments
  - name: files
  - name: schools
  - name: classes
  - name: moderators
    description: Назначение модераторов на предметы

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация
      description: Создаёт учётную запись с ролью «Пользователь» и сразу открывает сессию.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '201':
          description: Учётная запись создана, сессия открыта
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход по email и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Сессия открыта
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Учётная запись заблокирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выход
      description: Закрывает текущую сессию и стирает куку. Без сессии тоже отвечает 204.
      security:
        - {}
        - sessionCookie: []
      responses:
        '204':
          description: Сессия закрыта

  /accounts:
    get:
      tags: [accounts]
      operationId: getAllUsers
      summary: Все пользователи
      description: Только для администратора.
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [accounts]
      operationId: saveInfo
      summary: Правка своего профиля
      description: |
        Меняются только переданные поля. Школа и класс проверяются на
        согласованность: класс должен принадлежать выбранной школе.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nickname:
                  $ref: '#/components/schemas/Nickname'
                firstName:
                  type: string
                  maxLength: 100
                lastName:
                  type: string
                  maxLength: 100
                middleName:
                  type: string
                  maxLength: 100
                birthDate:
                  type: string
                  format: date
                description:
                  type: string
                  maxLength: 2000
                schoolId:
                  type: integer
                classId:
                  type: integer
                photo:
                  type: string
                  format: binary
                  description: Изображение JPEG, PNG, GIF или WebP, до 10 МБ
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /accounts/{account}:
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Профиль по никнейму
      description: Email виден владельцу профиля, модераторам и администратору, остальным — `null`.
      parameters:
        - name: account
          in: path
          required: true
          description: Никнейм
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [accounts]
      operationId: deleteUser
      summary: Удалить пользователя
      description: Только для администратора, себя удалить нельзя.
      parameters:
        - name: account
          in: path
          required: true
          description: Идентификатор учётной записи
          schema:
            type: integer
      responses:
        '204':
          description: Удалён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{id}/ban:
    post:
      tags: [accounts]
      operationId: banUser
      summary: Заблокировать
      description: Закрывает все сессии пользователя. Только для администратора.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Новый статус
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusAccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{id}/unban:
    post:
      tags: [accounts]
      operationId: unbanUser
      summary: Разблокировать
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Новый статус
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusAccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{id}/profile:
    patch:
      tags: [accounts]
      operationId: adminUpdateUser
      summary: Правка профиля администратором
      description: |
        Меняются только переданные поля. `null` в `school_id` отвязывает от школы
        и класса, `null` в `class_id` — только от класса.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateProfileRequest'
      responses:
        '200':
          description: Обновлённый пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{id}/role:
    put:
      tags: [accounts]
      operationId: updateRole
      summary: Сменить роль
      description: |
        Только для администратора, свою роль сменить нельзя. При снятии роли
        модератора снимаются и его назначения на предметы.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Новая роль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdateRoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{nickname}/course-progress:
    get:
      tags: [accounts]
      operationId: getCourseProgress
      summary: Прогресс по курсам
      description: По каждому курсу пользователя — занятия, баллы и статусы слушаний.
      parameters:
        - name: nickname
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Прогресс по каждому курсу
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseProgressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/school/{schoolId}:
    get:
      tags: [accounts]
      operationId: getBySchool
      summary: Пользователи школы
      description: Для модераторов и администратора.
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/class/{classId}:
    get:
      tags: [accounts]
      operationId: getByClass
      summary: Пользователи класса
      description: Модераторам и администратору — любой класс, ученику — только свой.
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/me/password:
    put:
      tags: [accounts]
      operationId: changePassword
      summary: Сменить пароль
      description: Остальные сессии пользователя закрываются, текущая остаётся.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Пароль изменён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts/admin/register:
    post:
      tags: [accounts]
      operationId: adminRegisterUser
      summary: Создать пользователя администратором
      description: Без `role_id` создаётся «Пользователь».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles:
    get:
      tags: [roles]
      operationId: getRoles
      summary: Все роли
      responses:
        '200':
          description: Роли
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /directions:
    get:
      tags: [directions]
      operationId: getDirections
      summary: Все направления
      responses:
        '200':
          description: Направления
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [directions]
      operationId: createDirection
      summary: Создать направление
      description: Только для администратора. Название уникально без учёта регистра.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRequest'
      responses:
        '201':
          description: Направление создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /directions/{id}:
    get:
      tags: [directions]
      operationId: getDirection
      summary: Направление по id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Направление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [directions]
      operationId: updateDirection
      summary: Переименовать направление
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRequest'
      responses:
        '200':
          description: Направление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [directions]
      operationId: deleteDirection
      summary: Удалить направление
      description: Вместе с предметами, темами, публикациями и их файлами.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Удалено
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /subjects:
    get:
      tags: [subjects]
      operationId: getSubjects
      summary: Предметы направления
      parameters:
        - name: directionId
          in: query
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница предметов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [subjects]
      operationId: createSubject
      summary: Создать предмет
      description: Только для администратора. Название уникально в пределах направления.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectCreateRequest'
      responses:
        '201':
          description: Предмет создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /subjects/{id}:
    get:
      tags: [subjects]
      operationId: getSubject
      summary: Предмет по id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Предмет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [subjects]
      operationId: updateSubject
      summary: Переименовать предмет
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRequest'
      responses:
        '200':
          description: Предмет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [subjects]
      operationId: deleteSubject
      summary: Удалить предмет
      description: Вместе с темами, публикациями и их файлами.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Удалён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /subject-topics:
    get:
      tags: [subject-topics]
      operationId: getSubjectTopics
      summary: Темы предмета
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница тем
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectTopicPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [subject-topics]
      operationId: createSubjectTopic
      summary: Создать тему
      description: Администратору и модераторам, назначенным на предмет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectTopicCreateRequest'
      responses:
        '201':
          description: Тема создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectTopicResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /subject-topics/{id}:
    get:
      tags: [subject-topics]
      operationId: getSubjectTopic
      summary: Тема по id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Тема
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectTopicResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [subject-topics]
      operationId: updateSubjectTopic
      summary: Переименовать тему
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRequest'
      responses:
        '200':
          description: Тема
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectTopicResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [subject-topics]
      operationId: deleteSubjectTopic
      summary: Удалить тему
      description: Вместе с публикациями и их файлами.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Удалена
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /publications:
    get:
      tags: [publications]
      operationId: getPublicationsByTopic
